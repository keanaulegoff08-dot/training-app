<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de Fonte</title>
<meta name="description" content="Carnet de musculation : calendrier, programmes, bilans, notes et vidéos de technique.">
<meta name="theme-color" content="#E6E9EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fonte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E6E9EC; --surface:#F7F8F9; --sunk:#DDE1E5; --ink:#14171B; --muted:#5B636C; --line:#C9CFD6;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --go:#178A4E; --hot:#CF3129; --warn:#9A7300;
  --k-masse:#1E9E5A; --k-pb:#E3AB00; --k-force:#1F5FD1; --k-perso:#7B4FD6; --k-libre:#8C96A1; --k-ink-pb:#14171B;
  --heat:#E0352B; --musc:#D2D7DD; --fig:#EEF0F2;
  --shadow:0 1px 0 rgba(20,23,27,.04), 0 8px 24px -12px rgba(20,23,27,.18);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101215; --surface:#191C20; --sunk:#0B0D0F; --ink:#ECEEF1; --muted:#949BA4; --line:#2A2F35;
    --accent:#5B8DEF; --accent-ink:#0B0D0F; --go:#3CC37A; --hot:#F0544A; --warn:#E7B416;
    --k-masse:#3CC37A; --k-pb:#F2C230; --k-force:#5B8DEF; --k-perso:#A585F5; --k-libre:#A9B2BC;
    --heat:#FF4A3D; --musc:#2C3238; --fig:#1C2025;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#101215; --surface:#191C20; --sunk:#0B0D0F; --ink:#ECEEF1; --muted:#949BA4; --line:#2A2F35;
  --accent:#5B8DEF; --accent-ink:#0B0D0F; --go:#3CC37A; --hot:#F0544A; --warn:#E7B416;
  --k-masse:#3CC37A; --k-pb:#F2C230; --k-force:#5B8DEF; --k-perso:#A585F5; --k-libre:#A9B2BC;
  --heat:#FF4A3D; --musc:#2C3238; --fig:#1C2025;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 calc(var(--nav-h) + 40px);-webkit-tap-highlight-color:transparent}
body.docked{padding-bottom:calc(var(--nav-h) + 120px)}
.wrap{max-width:680px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:900 clamp(40px,12vw,76px)/.86 var(--display);text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:break-word;hyphens:auto}
h2{font:900 30px/1 var(--display);text-transform:uppercase}
h3{font:800 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.sec{display:grid;gap:12px;margin-top:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:30px}
.brand{font:800 20px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.back{border:0;background:none;padding:4px 6px 4px 0;font:800 18px var(--display);text-transform:uppercase;display:flex;align-items:center;gap:4px;white-space:nowrap}
.bar-title{font:800 18px/1.1 var(--display);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sync{margin-left:auto;font:500 10px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.sync.ok i{background:var(--go)} .sync.busy i{background:var(--warn)}
.chip-btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.segs{max-width:680px;margin:8px auto 0;display:flex;gap:3px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--accent)}
.segs b{width:5px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.nav-row{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;height:var(--nav-h)}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font:600 11px var(--body);color:var(--muted);padding:6px 0}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .fab{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);justify-self:center;margin-top:-18px;box-shadow:var(--shadow);display:grid;place-items:center}
.nav .fab svg{stroke-width:2.6;width:24px;height:24px}

/* buttons */
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--hot);border:1px solid color-mix(in srgb,var(--hot) 40%,var(--line))}
.btn.wide{width:100%;padding:16px;font:800 20px var(--display);text-transform:uppercase;letter-spacing:.04em}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* kind chips */
.kind{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);white-space:nowrap}
.kind::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--kc)}
.k-masse{--kc:var(--k-masse)} .k-pb{--kc:var(--k-pb)} .k-force{--kc:var(--k-force)} .k-perso{--kc:var(--k-perso)} .k-libre{--kc:var(--k-libre)}

/* hero home */
.hero{padding-block:22px 4px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:10px 12px;min-width:0}
.stat b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-title{font:900 32px/1 var(--display);text-transform:uppercase;flex:1;min-width:0}
.cal-title small{font:500 12px var(--mono);color:var(--muted);margin-left:6px;letter-spacing:.04em}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font:500 10px var(--mono);color:var(--muted);letter-spacing:.06em}
.day{position:relative;aspect-ratio:1/1.08;border-radius:10px;border:1px solid transparent;background:var(--ground);display:grid;align-content:space-between;padding:5px 6px;text-align:left;min-width:0}
.day .d{font:700 17px/1 var(--display);font-variant-numeric:tabular-nums}
.day.out{opacity:.35}
.day.done{background:var(--kc);color:#fff}
.day.done.k-pb{color:var(--k-ink-pb)}
.day.plan{background:color-mix(in srgb,var(--kc) 16%,var(--ground));border-color:color-mix(in srgb,var(--kc) 55%,transparent);border-style:dashed}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{outline:2px solid var(--accent);outline-offset:2px}
.day .tag{font:600 8.5px/1.1 var(--mono);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.9}
.day .pips{display:flex;gap:2px}
.day .pips i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend .kind{font-weight:500;color:var(--ink)}
.legend .dash::before{background:transparent;border:1.5px dashed var(--muted)}
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
.mini{border:0;background:none;padding:0;text-align:left;display:grid;gap:4px;min-width:0;width:100%}
.mini b{font:800 14px var(--display);text-transform:uppercase}
.mini .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;width:100%}
.mini .g i{aspect-ratio:1;border-radius:2px;background:var(--sunk)}
.mini .g i.e{background:transparent}
.mini .g i.done{background:var(--kc)}
.mini .g i.plan{background:color-mix(in srgb,var(--kc) 35%,var(--sunk))}
.mini .g i.today{box-shadow:0 0 0 1.5px var(--ink)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card.lift{box-shadow:var(--shadow)}
.card.edge{border-left:5px solid var(--kc)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.meta{font:500 11.5px var(--mono);color:var(--muted)}
.exlist{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:13.5px}
.exlist li{display:flex;justify-content:space-between;gap:10px}
.exlist.wrap li span:last-child{white-space:normal;text-align:right}
.exlist li span:last-child{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.weekbar{display:flex;gap:3px}
.weekbar i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.weekbar i.past{background:var(--kc)}
.weekbar i.now{background:var(--kc);box-shadow:0 0 0 2px color-mix(in srgb,var(--kc) 35%,transparent)}

/* programmes */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.prog-intro{font-size:14.5px;max-width:65ch;margin:0}
.freq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.freq button span{overflow-wrap:anywhere}
.freq button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px}
.freq button b{font:900 34px/1 var(--display)}
.freq button span{font-size:11.5px;color:var(--muted);line-height:1.25}
.freq button[aria-pressed="true"]{border-color:var(--kc);box-shadow:inset 0 0 0 1.5px var(--kc)}
.why{border-left:3px solid var(--kc);padding:2px 0 2px 12px;font-size:14px;margin:0;max-width:65ch}
.daycard h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.daycard h3 small{font:500 11px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.mtag{display:inline-block;font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 5px;border-radius:4px;background:var(--sunk);color:var(--ink);margin-left:6px;vertical-align:1px}
.mtag.top{background:var(--ink);color:var(--ground)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-weight:700;font-size:13px}
.daypick button[aria-pressed="true"]{background:var(--kc);border-color:var(--kc);color:#fff}
.k-pb .daypick button[aria-pressed="true"]{color:var(--k-ink-pb)}

/* forms */
.field{position:relative;display:grid;gap:4px}
.input,.field input,.field select{width:100%;height:44px;border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:0 11px;font-size:15px;-webkit-appearance:none;appearance:none}
.input:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* picker */
.pick-list{display:grid;border-top:1px solid var(--line);max-height:360px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.pick .nm{font-weight:600;font-size:14.5px}
.pick .mu{font:500 11px var(--mono);color:var(--muted)}
.pick .add{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1;flex:none}
.pick .add[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sel-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.sel-item .ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;grid-column:1/-1}
.sel-item .note-f{grid-column:1/-1}
.sel-item .ctl input,.sel-item .ctl select{height:38px;font-size:14px}
.mini-btns{display:flex;gap:4px}
.mini-btns button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:14px}

/* session */
.list{display:grid;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.open{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ex.complete .ex-name{color:var(--muted)}
.ex-head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:3px 10px;align-items:center;padding:13px 14px;cursor:pointer}
.ex-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ex-n{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);background:var(--sunk);color:var(--muted)}
.ex.complete .ex-n{background:var(--go);color:#fff}
.ex-name{font:800 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.ex-rx{font:500 11px var(--mono);color:var(--muted);grid-column:2}
.dots{grid-row:span 2;display:flex;gap:4px;flex-wrap:wrap;max-width:60px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.on{background:var(--go);border-color:var(--go)}
.ex-body{padding:0 14px 16px;display:grid;gap:12px}
.cue{margin:0;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:14px;max-width:65ch}
.sets{display:grid;gap:8px}
.set-h,.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,.8fr) minmax(0,.9fr) 48px;gap:8px;align-items:center}
.set-h{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.set-n{font:800 20px var(--display);color:var(--muted);text-align:center}
.cell{position:relative}
.cell input,.cell select{width:100%;height:46px;border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:0 10px;font:700 20px var(--display);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.cell select{font:600 15px var(--body);padding-right:4px}
.cell input::placeholder{color:color-mix(in srgb,var(--muted) 60%,transparent);font-weight:500}
.cell input:focus,.cell select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.cell .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 10px var(--mono);color:var(--muted);pointer-events:none}
.check{width:48px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .15s,border-color .15s,transform .1s}
.check:active{transform:scale(.94)}
.check svg{width:22px;height:22px;stroke:var(--muted);stroke-width:3;fill:none}
.set.done .check{background:var(--go);border-color:var(--go)}
.set.done .check svg{stroke:#fff}
.set.done .cell input,.set.done .cell select{background:transparent;border-style:dashed}
.set.next .set-n{color:var(--accent)}
.set-tools{display:flex;gap:6px;justify-content:flex-end}
.verdict{font-size:13.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.verdict b{font:800 15px var(--display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.verdict.up b{color:var(--go)} .verdict.hold b{color:var(--warn)} .verdict.down b{color:var(--hot)}
.method{font-size:13px;display:flex;gap:8px;align-items:baseline}

/* plates */
.loader{display:grid;gap:8px}
.bb{display:flex;align-items:center;justify-content:center;height:92px;overflow-x:auto}
.bb .sleeve{width:22px;height:12px;background:linear-gradient(#cfd4da,#8d949c);border-radius:2px;flex:none}
.bb .collar{width:6px;height:26px;background:#8d949c;border-radius:2px;flex:none}
.bb .shaft{flex:0 1 110px;min-width:40px;height:8px;background:repeating-linear-gradient(90deg,#9aa1a9 0 2px,#b9bfc6 2px 4px)}
.plate{border-radius:3px;margin:0 1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset -3px 0 0 rgba(0,0,0,.12);flex:none}
.loader-cap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--muted)}
.loader-cap b{color:var(--ink);font-weight:500}
.warm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.warm .lbl{width:100%}
.wchip{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 9px;font:700 16px var(--display);font-variant-numeric:tabular-nums}
.wchip small{font:500 10px var(--mono);color:var(--muted);margin-left:2px}
.wchip[aria-pressed="true"]{background:var(--sunk);text-decoration:line-through;color:var(--muted)}
.tempo{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.tempo-top{display:flex;align-items:center;gap:8px}
.tempo-phase{font:900 34px/1 var(--display);text-transform:uppercase;flex:1;min-width:0}
.tempo-reps{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.tempo-reps small{font:500 10px var(--mono);color:var(--muted);display:block;letter-spacing:.08em}
.track{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px}
.track.down i{background:var(--hot)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);transform:translateY(calc(100% + var(--nav-h) + 60px));visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.dock.show{transform:none;visibility:visible;transition:transform .25s ease}
.dock-row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:color-mix(in srgb,var(--ground) 18%,transparent)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.dock-time{font:900 44px/1 var(--display);font-variant-numeric:tabular-nums}
.dock-lbl{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.65;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-btns{margin-left:auto;display:flex;gap:6px}
.dock-btns button{border:1px solid color-mix(in srgb,var(--ground) 25%,transparent);background:transparent;color:var(--ground);border-radius:9px;padding:9px 10px;font-weight:700;font-size:13px}
.dock.over{background:var(--go)}
.dock.over .dock-time{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* bilan */
.bilan-head{padding-block:20px 0;display:grid;gap:10px}
.reading{font-size:16px;line-height:1.55;max-width:62ch;margin:0}
.reading b{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpis .stat small{display:block;font:500 11px var(--mono);margin-top:4px}
.up-t{color:var(--go)} .down-t{color:var(--hot)}
.gauge{display:grid;gap:8px}
.gauge-bar{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--sunk),color-mix(in srgb,var(--warn) 60%,var(--sunk)) 55%,var(--hot))}
.gauge-bar i{position:absolute;top:-5px;width:4px;height:24px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.gauge-scale{display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--muted)}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.dist i{display:block}
.bars{display:grid;gap:7px}
.mbar{display:grid;grid-template-columns:118px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.mbar .t{height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden}
.mbar .t i{position:absolute;inset:0 auto 0 0;background:var(--heat);border-radius:5px}
.mbar .t .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted);background:color-mix(in srgb,var(--go) 12%,transparent)}
.mbar .t.wk i{background:var(--ink);opacity:.8}
.mbar span:last-child{font:500 11.5px var(--mono);text-align:right}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-items:center}
.bodies figure{margin:0;display:grid;gap:4px;justify-items:center;width:100%}
.bodies svg{width:100%;max-width:190px;height:auto}
.bodies figcaption{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.heatscale{display:flex;align-items:center;gap:8px;font:500 10px var(--mono);color:var(--muted)}
.heatscale i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--musc),var(--heat))}
.goal{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal-top b{font:800 18px var(--display);text-transform:uppercase}
.goal-top span{font:500 12px var(--mono);white-space:nowrap}
.pr{display:inline-block;background:var(--heat);color:#fff;font:700 10px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.sugg{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--warn);margin-left:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:50;transition:all .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;font-weight:600}
@media (max-width:380px){
  .set-h,.set{grid-template-columns:18px minmax(0,1fr) minmax(0,.8fr) minmax(0,.9fr) 44px;gap:6px}
  .check{width:44px}
  .mbar{grid-template-columns:96px 1fr 40px}
  .day .tag{display:none}
}

/* v3 : notes, vidéos, fiche exercice */
textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:10px 11px;font:15px/1.45 var(--body);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sel-item textarea{min-height:38px;font-size:14px;padding:8px 10px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.pastnotes{display:grid;gap:4px;border-left:2px solid var(--line);padding-left:10px}
.pastnotes p{margin:0;font-size:13.5px;max-width:62ch}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;text-align:left;padding:2px 0}
.vids{display:grid;gap:6px}
.vrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{position:relative;flex:none;width:84px;height:112px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);padding:0;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .noposter{width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--sunk) 0 8px,var(--ground) 8px 16px)}
.thumb .tdur,.thumb .tdate{position:absolute;left:5px;bottom:5px;font:600 9.5px var(--mono);color:#fff;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:4px}
.thumb .tdate{bottom:auto;top:5px}
.thumb::after{content:"";position:absolute;right:6px;bottom:6px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.thumb.add{border-style:dashed;background:transparent;cursor:pointer;font-weight:700;font-size:13px;text-align:center;padding:6px;color:var(--accent)}
.thumb.add::after{display:none}
.thumb.add.busy{color:var(--muted);pointer-events:none;font-size:11px}
.thumb.sel{outline:3px solid var(--accent);outline-offset:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.vgrid .thumb{width:100%;height:auto;aspect-ratio:3/4}
.pickbtn{border:0;background:none;text-align:left;padding:0;cursor:pointer}
.pickbtn .nm::after{content:" ›";color:var(--muted)}
.exhero{grid-template-columns:minmax(0,1fr) 76px;align-items:end}
.exfig svg{width:76px;height:auto;display:block}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:14px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--ground)}
.timeline p{margin:3px 0 0;max-width:62ch}
.install{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.install ol{margin:6px 0 0;padding-left:18px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,10,12,.72);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.modal-card{background:var(--surface);border-radius:16px;padding:14px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
.modal-card.pair{width:min(820px,100%)}
.players{display:grid;gap:8px}
.pair .players{grid-template-columns:1fr 1fr}
.players figure{margin:0;display:grid;gap:4px}
.players video{width:100%;max-height:62vh;background:#000;border-radius:10px;display:block}
.players figcaption{font:500 10.5px var(--mono);color:var(--muted)}
#pscrub{width:100%;accent-color:var(--accent)}
body.modal-open{overflow:hidden}
.sheet{width:min(460px,100%)}
.sheet .chips{flex-wrap:wrap;overflow:visible}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px;cursor:pointer}
.checkline input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--hot);flex:none}
/* v4 : générateur */
.gen-cta{position:relative;display:grid;gap:4px;text-align:left;border:0;border-radius:16px;padding:18px 44px 18px 18px;background:var(--k-perso);color:#fff;box-shadow:var(--shadow);cursor:pointer}
.gen-cta-t{font:900 30px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.gen-cta-d{font-size:14px;opacity:.92;max-width:52ch}
.gen-cta-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:900 40px/1 var(--display)}
.goalrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:0}
.goalnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--display);background:var(--sunk);color:var(--muted)}
.goalrow.on .goalnum{background:var(--k-perso);color:#fff}
.goalchips{display:flex;flex-wrap:wrap;gap:6px}
.goalchips span{font:600 11.5px var(--body);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--k-perso) 14%,var(--surface));color:var(--ink)}
.mtag.mine{background:color-mix(in srgb,var(--k-perso) 22%,var(--surface))}
.gen-go{background:var(--k-perso);color:#fff}
.gday h3 span{min-width:0}
.freq.k-perso button[aria-pressed="true"]{border-color:var(--k-perso);box-shadow:inset 0 0 0 1.5px var(--k-perso)}
@media (max-width:380px){.sel-item .ctl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dow = s => (pd(s).getDay() + 6) % 7; // lundi = 0

function persistLocal() { clearTimeout(localT); localT = setTimeout(() => { store.set(LK_S, DB.sessions); store.set(LK_C, DB.config); }, 250); }
function saveSession(s) { s.updatedAt = Date.now(); DB.sessions[s.id] = s; persistLocal(); queuePush('sessions/' + s.id, () => DB.sessions[s.id]); }
function saveConfig() { DB.config.updatedAt = Date.now(); persistLocal(); queuePush('config/main', () => DB.config); }
function deleteSession(id) { const s = DB.sessions[id]; if (!s) return; if (s.items && typeof deleteVideo === 'function') for (const it of s.items) for (const v of it.videos || []) deleteVideo(v); DB.sessions[id] = {id, deleted: true, updatedAt: Date.now()}; persistLocal(); queuePush('sessions/' + id, () => DB.sessions[id]); }
const allSessions = () => Object.values(DB.sessions).filter(s => s && !s.deleted);

const pend = {};
function setSync(st) { syncState = st; const el = $('#sync'); if (el) { el.className = 'sync ' + st; el.lastChild.textContent = st === 'ok' ? 'Sauvegardé' : st === 'busy' ? 'Envoi…' : 'Sur l’appareil'; } }
function queuePush(path, get) {
  if (!dbh) return;
  const p = pend[path] || (pend[path] = {});
  p.get = get; clearTimeout(p.t); setSync('busy');
  p.t = setTimeout(() => flush(path), 1200);
}
async function flush(path) {
  const p = pend[path]; if (p.busy) { p.again = true; return; }
  p.busy = true;
  try { await dbh.doc(path).set(JSON.parse(JSON.stringify(p.get()))); }
  catch (e) { if (e && e.code === 'unavailable') { p.busy = false; setTimeout(() => flush(path), 2000 + Math.random() * 1500); return; } console.warn('db', e); }
  p.busy = false;
  if (p.again) { p.again = false; flush(path); }
  else if (!Object.values(pend).some(x => x.busy)) setSync('ok');
}
async function connectDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    window.claude.use('assets').then(a => { assetsNs = a; if (a && V.view === 'session') { const y = window.scrollY; viewSession(); window.scrollTo(0, y); } }).catch(() => {});
    const db = await window.claude.use('db'); if (!db) return;
    const [ss, cs] = await Promise.all([db.collection('sessions').limit(1000).get(), db.doc('config/main').get()]);
    dbh = db;
    const seen = new Set();
    for (const d of ss.docs) {

/* ================= MIGRATION v1 ================= */
function migrateV1() {
  if (DB.config.migrated) return;
  const hist = store.get('carnet-fonte-historique-v1') || [];
  const cur = store.get('carnet-fonte-seance-v1');
  const mk = (id, ts, dur, exMap, done) => {
    const items = buildItems(V1_TEMPLATE.items, null, 'libre');
    items.forEach(it => {
      const old = Object.keys(V1_MAP).find(k => V1_MAP[k] === it.ex); const e = exMap[old];
      if (!e) { it.sets = it.sets.map(() => ({kg: '', reps: '', rpe: '', done: false})); return; }
      it.sets = e.sets;
    });
    const date = ymd(new Date(ts - (dur || 0) * 60000));
    return {id, date, title: V1_TEMPLATE.name, kind: 'libre', status: done ? 'done' : 'active', items, startedAt: ts - (dur || 60) * 60000, endedAt: done ? ts : null, createdAt: ts, updatedAt: Date.now(), imported: true};
  };
  for (const h of hist) {
    const exMap = {};
    for (const k in h.ex || {}) { const e = h.ex[k]; exMap[k] = {sets: (e.reps || []).map((r, i) => ({kg: e.kg != null ? String(e.kg) : '', reps: String(r || ''), rpe: String((e.rpe || [])[i] || ''), done: true}))}; }
    const s = mk('v1-' + h.date, h.date, h.dur, exMap, true);
    if (!DB.sessions[s.id]) DB.sessions[s.id] = s;
  }
  if (cur && cur.started && cur.sets) {
    const later = hist.some(h => h.date > cur.started);
    const all = Object.values(cur.sets).flat(), done = all.filter(x => x.done).length;
    if (!later && done) {
      const exMap = {}; for (const k in cur.sets) exMap[k] = {sets: cur.sets[k].map(x => ({kg: x.kg || '', reps: x.reps || '', rpe: x.rpe || '', done: !!x.done}))};
      const fin = done >= all.length / 2;
      const s = mk('v1c-' + cur.started, fin ? Math.max(cur.started + 60000, Date.now() > cur.started + 3 * 36e5 ? cur.started + 75 * 60000 : Date.now()) : Date.now(), 0, exMap, fin);
      s.startedAt = cur.started; s.date = ymd(new Date(cur.started));
      if (!DB.sessions[s.id]) DB.sessions[s.id] = s;
    }
  }
  if (!DB.config.templates.some(t => t.name === V1_TEMPLATE.name)) DB.config.templates.push({id: 'tpl-v1', name: V1_TEMPLATE.name, kind: 'libre', items: V1_TEMPLATE.items});
  if (!DB.config.goals.length) {
    const b = bestE1('bench');
    DB.config.goals.push({id: uid(), ex: 'bench', target: b ? Math.ceil((b + 5) / 5) * 5 : 140, start: b ? Math.round(b) : null, created: Date.now(), suggested: true});
  }
  DB.config.migrated = true; DB.config.updatedAt = Date.now();
  store.set(LK_S, DB.sessions); store.set(LK_C, DB.config);
}

function exportData() {
  return JSON.stringify({app: 'carnet-de-fonte', version: 3, exportedAt: new Date().toISOString(), sessions: DB.sessions, config: DB.config});
}
async function doExport() {
  const name = `carnet-de-fonte-${TODAY()}.json`, data = exportData();
  if (!STANDALONE && window.claude && window.claude.use) {
    const dl = await window.claude.use('downloads');
    if (dl) {
      try { await dl.save({filename: name, data}); toast('Sauvegarde enregistrée'); }
      catch (e) { if (e.code !== 'declined') toast(e.code === 'rate_limited' ? 'Patiente un instant puis réessaie' : 'Sauvegarde impossible ici'); }
      return;
    }
  }
  const file = new File([data], name, {type: 'application/json'});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: 'Sauvegarde Carnet de Fonte'}); } catch (e) {}
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

function importData(text) {
  let d; try { d = JSON.parse(text); } catch (e) { throw new Error('Fichier illisible'); }
  if (!d || d.app !== 'carnet-de-fonte' || !d.sessions || !d.config) throw new Error('Ce fichier n’est pas une sauvegarde Carnet de Fonte');
  let added = 0;
  for (const id in d.sessions) {
    const r = d.sessions[id], l = DB.sessions[id];
    if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { DB.sessions[id] = r; if (!l) added++; queuePush('sessions/' + id, () => DB.sessions[id]); }
  }
  const c = DB.config, rc = d.config;
  const byId = (a, b) => { const m = {}; [...(a || []), ...(b || [])].forEach(x => { m[x.id] = m[x.id] || x; }); return Object.values(m); };
  c.goals = byId(c.goals, rc.goals);
  c.templates = byId(c.templates, rc.templates);
  c.myPrograms = byId(c.myPrograms, rc.myPrograms);
  c.muOverride = Object.assign({}, rc.muOverride, c.muOverride);
  c.customs = Object.assign({}, rc.customs, c.customs);
  c.maxes = Object.assign({}, rc.maxes, c.maxes);
  if (rc.plan && (!c.plan || (rc.updatedAt || 0) > (c.updatedAt || 0))) c.plan = rc.plan;

  saveConfig(); persistLocal();

}

}

  let cls = 'day', tag = '', kc = '';

  else if (inf.act.length) { cls += ' plan'; kc = inf.act[0].kind; tag = 'En cours'; }
  else if (inf.planned.length) { cls += ' plan'; kc = inf.planned[0].kind; tag = inf.planned[0].title; }

        <label class="cell"><select id="rpe-${it.u}-${j}" data-u="${it.u}" data-i="${j}" data-f="rpe" aria-label="RPE série ${j + 1}">${RPES.map(r => `<option value="${r}" ${String(x.rpe) === r ? 'selected' : ''}>${r ? r.replace('.', ',') : '—'}</option>`).join('')}</select></label>
        <button class="check" data-done="${it.u}:${j}" aria-pressed="${x.done}" aria-label="Valider la série ${j + 1}">${CHECK}</button></div>`).join('')}</div>

    body += `<label class="field"><span class="lbl">Note technique · schéma moteur</span><textarea class="notes" id="note-${it.u}" data-note="${it.u}" rows="2" placeholder="Ce que tu as senti, corrigé, à garder pour la prochaine fois">${esc(it.note || '')}</textarea></label>`;

  }
  return `<section class="ex ${open ? 'open' : ''} ${all ? 'complete' : ''}">

    </button>${open ? `<div class="ex-body">${body}</div>` : ''}</section>`;
}

function viewBilan() {
  const s = DB.sessions[V.id]; if (!s) return go('home');
  backBar('Bilan');
  const st = sessionStats(s);
  const prev = sortedDone().find(x => x.id !== s.id && x.title === s.title && (x.endedAt || 0) < (s.endedAt || Date.now()));
  const pst = prev ? sessionStats(prev) : null;
  const dTon = pst && pst.ton ? (st.ton - pst.ton) / pst.ton * 100 : null;
  const dSets = pst ? st.sets - pst.sets : null;
  const musSorted = Object.entries(st.mus).sort((a, b) => b[1] - a[1]);
  const wk = weekMuscles(s.date);
  // records
  const prs = [];
  const seenEx = new Set();
  for (const it of s.items) {
    if (seenEx.has(it.ex)) continue; seenEx.add(it.ex);
    let today = null; for (const x of s.items.filter(i => i.ex === it.ex)) for (const y of x.sets) if (y.done) { const e = e1rm(y.kg, y.reps, y.rpe); if (e && (!today || e > today)) today = e; }
    const before = bestE1(it.ex, s.endedAt || Date.now());
    if (today && getEx(it.ex).kind === 'poly' && (!before || today > before + .4)) prs.push({ex: it.ex, v: today, before});
  }
  // lecture
  const lab = intensityLabel(st.rpe);
  let reading = `<b>${st.sets} séries</b>${st.dur ? ` en ${st.dur} min` : ''}, <b>${fr(Math.round(st.ton), 0)} kg</b> déplacés`;
  if (dTon != null) reading += ` : ${dTon >= 0 ? '+' : ''}${fr(dTon, 0)} % de volume par rapport au ${shortDate(prev.date)}`;
  reading += '. ';
  if (st.rpe) reading += `Intensité <b>${lab}</b> (RPE moyen ${fr(st.rpe)}, soit environ ${fr(Math.max(0, 10 - st.rpe))} rep${10 - st.rpe >= 2 ? 's' : ''} en réserve). `;
  if (musSorted.length) reading += `Les muscles les plus sollicités : <b>${musSorted.slice(0, 2).map(m => MUSCLES[m[0]].l.toLowerCase()).join('</b> et <b>')}</b>. `;
  if (prs.length) reading += `Record estimé sur ${prs.map(p => `<b>${getEx(p.ex).name.toLowerCase()}</b> (${fr(r25(p.v))} kg)`).join(', ')}.`;
  // intensité
  const pos = st.rpe ? Math.max(0, Math.min(100, (st.rpe - 6) / 4 * 100)) : null;
  const dt = st.dist[0] + st.dist[1] + st.dist[2] || 1;
  // objectifs
  const goals = DB.config.goals.map(g => goalRow(g, s)).join('');
  let adherence = '';
  if (s.plan && DB.config.plan && DB.config.plan.type === s.plan.type) {
    const p = DB.config.plan, t = s.date; let planned = 0, doneN = 0;
    for (let d = p.start; d <= t && diffDays(p.start, d) < 49; d = addDays(d, 1)) { const k = p.days.indexOf(dow(d)); if (k >= 0 && !(p.skips || []).includes(`${d}#${k}`)) { planned++; if (allSessions().some(x => x.planKey === `${d}#${k}` && x.status === 'done')) doneN++; } }
    adherence = `<div class="goal"><div class="goal-top"><b>Programme ${(getProg(p.type) || {short: ''}).short}</b><span>${doneN}/${planned} séances</span></div><div class="progress"><i style="width:${planned ? doneN / planned * 100 : 0}%;background:var(--k-${kindOf(p.type)})"></i></div><div class="meta">Semaine ${s.plan.week + 1}/7 · ${WEEKS[s.plan.week].n}${s.plan.week < 6 ? ` · prochaine étape : ${WEEKS[s.plan.week + 1].n.toLowerCase()}` : ' · bloc terminé après cette semaine'}</div></div>`;
  }
  const verdicts = s.items.map(it => ({it, v: verdict(it)})).filter(x => x.v);
  const scale = 25;
  $('#app').innerHTML = `
    <section class="bilan-head">
      <div class="eyebrow">${longDate(s.date)}${st.dur ? ' · ' + st.dur + ' min' : ''}</div>
      <h1>${esc(s.title)}</h1>

      <p class="reading">${reading}</p>
    </section>
    <section class="sec"><h2>Volume</h2>
      <div class="kpis">
        <div class="stat"><b>${fr(Math.round(st.ton), 0)}</b><span>Tonnage kg</span>${dTon != null ? `<small class="${dTon >= 0 ? 'up-t' : 'down-t'}">${dTon >= 0 ? '▲' : '▼'} ${fr(Math.abs(dTon), 0)} % vs ${shortDate(prev.date)}</small>` : '<small class="muted">1re fois pour cette séance</small>'}</div>
        <div class="stat"><b>${st.sets}<span style="font-size:18px;color:var(--muted)">/${st.total}</span></b><span>Séries faites</span>${dSets != null ? `<small class="${dSets >= 0 ? 'up-t' : 'down-t'}">${dSets >= 0 ? '+' : ''}${dSets} série${Math.abs(dSets) > 1 ? 's' : ''}</small>` : ''}</div>
        <div class="stat"><b>${fr(st.reps, 0)}</b><span>Répétitions</span></div>
        <div class="stat"><b>${st.sets ? fr(st.ton / Math.max(1, st.reps), 1) : '—'}</b><span>Charge moyenne / rep</span></div>
      </div>
    </section>
    <section class="sec"><h2>Intensité</h2>
      <div class="card gauge">

        <div class="gauge-bar">${pos != null ? `<i style="left:${pos}%"></i>` : ''}</div>
        <div class="gauge-scale"><span>6 · facile</span><span>7</span><span>8</span><span>9</span><span>10 · échec</span></div>
        <div class="dist" aria-hidden="true"><i style="flex:${st.dist[0] / dt};background:var(--musc)"></i><i style="flex:${st.dist[1] / dt};background:var(--warn)"></i><i style="flex:${st.dist[2] / dt};background:var(--heat)"></i></div>

      </div>
    </section>
    <section class="sec"><h2>Muscles travaillés</h2>
      <div class="card">
        <div class="bodies"><figure>${bodySVG(st.mus, 'front')}<figcaption>Face</figcaption></figure><figure>${bodySVG(st.mus, 'back')}<figcaption>Dos</figcaption></figure></div>

        <div class="lbl" style="margin-top:6px">Séries effectives aujourd’hui</div>
        <div class="bars">${musSorted.slice(0, 8).map(([m, v]) => `<div class="mbar"><span>${MUSCLES[m].l}</span><span class="t"><i style="width:${Math.min(100, v / musSorted[0][1] * 100)}%"></i></span><span class="num">${fr(v)}</span></div>`).join('') || '<p class="empty">Aucune série validée.</p>'}</div>
        <div class="lbl" style="margin-top:10px">Semaine en cours · zone utile 10–20 séries</div>
        <div class="bars">${Object.entries(wk).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([m, v]) => `<div class="mbar"><span>${MUSCLES[m].l}</span><span class="t wk"><span class="zone" style="left:${10 / scale * 100}%;width:${10 / scale * 100}%"></span><i style="width:${Math.min(100, v / scale * 100)}%"></i></span><span class="num">${fr(v)}</span></div>`).join('')}</div>

      ${prs.length ? `<div class="card">${prs.map(p => `<div class="goal-top"><b>${esc(getEx(p.ex).name)}<span class="pr">RECORD</span></b><span>${fr(r25(p.v))} kg est.${p.before ? ` (avant ${fr(r25(p.before))})` : ''}</span></div>`).join('')}</div>` : ''}
    </section>
    ${verdicts.length ? `<section class="sec"><h2>Prochaine fois</h2>${verdicts.map(({it, v}) => `<div class="verdict ${v.k}"><b>${v.t}</b><span><b style="font:600 14px var(--body);text-transform:none;color:var(--ink)">${esc(getEx(it.ex).name)}${it.m === 'top' ? ' (top set)' : it.m === 'backoff' ? ' (back-off)' : ''}</b> — ${v.m}</span></div>`).join('')}</section>` : ''}

    </section>`;
}
function goalRow(g, s) {
  const e = getEx(g.ex), series = e1Series(g.ex), cur = bestE1(g.ex);
  const start = g.start || (series[0] ? Math.round(series[0].v) : null);
  const pct = cur && start != null && g.target > start ? Math.max(0, Math.min(1, (cur - start) / (g.target - start))) : cur && cur >= g.target ? 1 : 0;
  const eta = goalETA(g);
  const todayBest = s ? (() => { let b = null; for (const it of s.items) if (it.ex === g.ex) for (const y of it.sets) if (y.done) { const v = e1rm(y.kg, y.reps, y.rpe); if (v && (!b || v > b)) b = v; } return b; })() : null;
  return `<div class="goal"><div class="goal-top"><b>${esc(e.name)} ${fr(g.target)} kg${g.suggested ? '<span class="sugg">suggéré</span>' : ''}</b><span>${cur ? fr(r25(cur)) : '—'} / ${fr(g.target)}</span></div>
    <div class="progress"><i style="width:${pct * 100}%"></i></div>
    <div class="meta">${cur ? (cur >= g.target ? 'Objectif atteint.' : `Il reste ${fr(g.target - r25(cur))} kg${start != null ? ` · +${fr(Math.max(0, r25(cur) - start))} kg depuis le départ` : ''}${eta ? ` · à ce rythme, ~${eta} semaine${eta > 1 ? 's' : ''}` : ''}.`) : 'Pas encore de série enregistrée sur cet exercice.'}${todayBest ? ` Aujourd’hui : ${fr(r25(todayBest))} kg estimés.` : ''}</div></div>`;
}

  const target = DB.config.plan ? DB.config.plan.freq : null, maxN = Math.max(target || 0, 3, ...weeks.map(w => w.n));

    ${[0, Math.ceil(maxN / 2), maxN].map(v => `<line x1="0" x2="${W}" y1="${H - v / maxN * (H - 10)}" y2="${H - v / maxN * (H - 10)}" stroke="var(--line)" stroke-width="1"/><text x="${W}" y="${H - v / maxN * (H - 10) - 3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Martian Mono,monospace">${v}</text>`).join('')}

    ${target ? `<line x1="0" x2="${W}" y1="${H - target / maxN * (H - 10)}" y2="${H - target / maxN * (H - 10)}" stroke="var(--k-${DB.config.plan.type})" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
    ${weeks.map((w, i) => i % 3 === 2 || i === 11 ? `<text x="${i * bw + bw / 2}" y="${H + 16}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Martian Mono,monospace">${i === 11 ? 'cette sem.' : shortDate(w.m).replace('.', '')}</text>` : '').join('')}

  $('#app').innerHTML = `
    <section class="hero"><div class="eyebrow">Objectifs & repères</div><h1>Vers où tu pousses</h1></section>
    <section class="sec"><h2>Mes objectifs</h2>
      <div class="card">${DB.config.goals.map(g => `${goalRow(g)}<div class="row" style="justify-content:flex-end;margin-top:-4px">${g.suggested ? `<button class="btn sm quiet" data-goal-keep="${g.id}">Je le garde</button>` : ''}<button class="btn sm danger" data-goal-rm="${g.id}">Retirer</button></div>`).join('') || '<p class="empty">Aucun objectif pour l’instant.</p>'}</div>
      <div class="card"><h3>Nouvel objectif de force</h3>
        <div class="two"><div class="field"><label class="lbl" for="g-ex">Exercice</label><select id="g-ex">${polys.map(e => `<option value="${e.id}" ${e.id === 'squat' ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl" for="g-kg">1RM visé (kg)</label><input id="g-kg" inputmode="decimal" placeholder="Ex. 160"></div></div>
        <button class="btn" data-goal-add>Ajouter l’objectif</button>
        <p class="meta" style="margin:0">Le 1RM est estimé à partir de tes séries (formule d’Epley, corrigée par le RPE). Au-delà de 12 reps + reps en réserve, la série n’est pas prise en compte : l’estimation n’est plus fiable.</p>
      </div>
    </section>
    <section class="sec"><h2>Mes max</h2>
      <div class="card"><p class="muted" style="margin:0;font-size:14px">Servent à calculer les charges en % du programme Force athlétique. Laisse vide pour utiliser l’estimation tirée de tes séances.</p>
        <div class="two">${refs.map(r => { const est = bestE1(r); return `<div class="field"><label class="lbl" for="max-${r}">${getEx(r).name}</label><input id="max-${r}" data-max="${r}" inputmode="decimal" value="${esc(DB.config.maxes[r] || '')}" placeholder="${est ? 'est. ' + fr(r25(est)) : 'kg'}"></div>`; }).join('')}</div></div>
    </section>
    <section class="sec"><h2>Régularité</h2><div class="card">${chart}<p class="meta" style="margin:0">Séances terminées par semaine${target ? ` · pointillés : objectif du programme (${target}/sem)` : ''}.</p></div></section>
    ${backupSection()}`;

  const pts = sortedDone().slice().reverse().map(s => { let b = null; for (const it of s.items) if (it.ex === exId) for (const x of it.sets) if (x.done && num(x.kg) && (!b || num(x.kg) > b)) b = num(x.kg); return b ? {t: s.endedAt, d: s.date, v: b} : null; }).filter(Boolean);
  return {pts, label: 'Charge max'};
}
function lineChart(pts, unit) {

  const W = 320, H = 130, L = 8, R = 52, T = 12, B = 22;
  const vs = pts.map(p => p.v), lo = Math.floor((Math.min(...vs) - 2) / 5) * 5, hi = Math.ceil((Math.max(...vs) + 2) / 5) * 5;
  const X = i => L + i * (W - L - R) / (pts.length - 1), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Évolution ${unit}">
    ${[lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R + 6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Martian Mono,monospace">${fr(v)}</text>`).join('')}
    <path d="${d}L${X(li)},${H - B}L${X(0)},${H - B}Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i === li ? 4.5 : 2.5}" fill="${i === li ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"><title>${shortDate(p.d)} : ${fr(p.v)} ${unit}</title></circle>`).join('')}

    <text x="${X(li)}" y="${H - 6}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Martian Mono,monospace">${shortDate(pts[li].d)}</text>

/* ================= MINUTEUR, MÉTRONOME, ÉCRAN ================= */
let timer = null, wakeLock = null, audio = null;
const tempo = {on: false, ecc: 4, reps: 0, last: null, t0: 0};
function beep(freq, dur) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.type = 'square'; g.gain.value = .08;
    o.connect(g); g.connect(audio.destination);
    g.gain.setTargetAtTime(0, audio.currentTime + dur * .7, .02);
    o.start(); o.stop(audio.currentTime + dur + .1);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function startRest(sec, label) {
  timer = {end: Date.now() + sec * 1000, total: sec, label, rang: false};
  $('#dock').classList.add('show'); $('#dock').classList.remove('over'); document.body.classList.add('docked');
  tick();
}
function stopRest() { timer = null; $('#dock').classList.remove('show', 'over'); document.body.classList.remove('docked'); }
function tick() {
  if (!timer) return;
  const left = Math.round((timer.end - Date.now()) / 1000), a = Math.abs(left);
  $('#dock-time').textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + pad(a % 60);
  $('#dock-lbl').textContent = (left <= 0 ? 'C’est reparti · ' : 'Repos · ') + timer.label;
  $('#ringfg').style.strokeDashoffset = 144.5 * (1 - Math.max(0, Math.min(1, left / timer.total)));
  if (left <= 3 && left > 0 && timer.lastBeep !== left) { timer.lastBeep = left; beep(600, .06); }
  if (left <= 0 && !timer.rang) { timer.rang = true; $('#dock').classList.add('over'); beep(990, .35); buzz([300, 120, 300]); }
}
function chrono() {
  const el = $('#chrono'); if (!el) return;
  const s = DB.sessions[V.id]; if (!s || !s.startedAt) { el.textContent = 'pas commencé'; return; }
  const sec = Math.floor(((s.endedAt || Date.now()) - s.startedAt) / 1000);
  el.textContent = `${Math.floor(sec / 3600) ? Math.floor(sec / 3600) + 'h' : ''}${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`;
}
setInterval(() => { tick(); if (V.view === 'session') chrono(); }, 250);
function tempoLoop() {
  if (!tempo.on) return;
  const phases = [['Monte', 1, 'up', 880], ['Serre', 1, 'up', 660], ['Descends', tempo.ecc, 'down', 440]];
  const cyc = phases.reduce((a, p) => a + p[1], 0), t = (performance.now() - tempo.t0) / 1000;
  const rep = Math.floor(t / cyc), within = t - rep * cyc;
  let acc = 0, idx = 0; for (; idx < phases.length; idx++) { if (within < acc + phases[idx][1]) break; acc += phases[idx][1]; }
  const p = phases[idx], frac = (within - acc) / p[1], key = rep * 10 + idx;
  if (key !== tempo.last) { tempo.last = key; beep(p[3], .08); if (idx === 0) tempo.reps = rep; }
  const ph = $('#tp-phase'), br = $('#tp-bar'), tr = $('#tp-track'), rp = $('#tp-reps');
  if (ph) {
    ph.textContent = p[2] === 'down' ? `${p[0]} ${Math.ceil(p[1] - (within - acc))}` : p[0];
    br.style.width = (p[2] === 'down' ? 1 - frac : frac) * 100 + '%';
    tr.classList.toggle('down', p[2] === 'down'); rp.textContent = tempo.reps;
  }
  requestAnimationFrame(tempoLoop);
}
async function toggleWake(b) {
  try {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; b.setAttribute('aria-pressed', 'false'); return; }
    wakeLock = await navigator.wakeLock.request('screen'); b.setAttribute('aria-pressed', 'true');
    wakeLock.addEventListener('release', () => { wakeLock = null; const w = $('#wake'); if (w) w.setAttribute('aria-pressed', 'false'); });
  } catch (e) { b.textContent = 'Indispo'; setTimeout(() => { b.textContent = 'Écran on'; }, 2000); }
}

      const v = await storeVideo(file, status);
      const s2 = DB.sessions[S.id], it = findItem(s2, u); (it.videos = it.videos || []).push(v); saveSession(s2);
      toast('Vidéo ajoutée'); if (V.view === 'session') { const y = window.scrollY; viewSession(); window.scrollTo(0, y); }
    } catch (e) { console.warn(e); toast(videoError(e)); status('+ Vidéo'); if (tile) tile.classList.remove('busy'); }
    el.value = ''; return;
  }
  if (el.id === 'imp' && el.files && el.files[0]) {
    try { const n = importData(await el.files[0].text()); toast(`Sauvegarde importée : ${n} nouvelle${n > 1 ? 's' : ''} séance${n > 1 ? 's' : ''}`); render(); }
    catch (e) { toast(e.message || 'Import impossible'); }
    el.value = ''; return;
  }
  if (el.id === 'd-kind') { V.draft.kind = el.value; return; }
  if (el.dataset.gt || el.dataset.gex || el.dataset.gw || el.dataset.gmu) {
    const G = V.gen, i = +(el.dataset.gt || el.dataset.gex || el.dataset.gw || el.dataset.gmu), g = G.goals[i];
    if (el.dataset.gt) { g.t = el.value; if (g.t === 'weak' && !LIFTS_MAIN.includes(g.ex)) g.ex = 'bench'; }
    if (el.dataset.gex) g.ex = el.value; if (el.dataset.gw) g.w = el.value; if (el.dataset.gmu) g.mu = el.value;
    const y = window.scrollY; viewGen(); window.scrollTo(0, y); return;
  }
  if (el.dataset.gi && V.gen && V.gen.prog) { const [di, ii, f] = el.dataset.gi.split(':').map(Number); V.gen.prog.days[di].items[ii][f] = num(el.value); return; }
  if (el.dataset.exmu) {
    const id = el.dataset.exmu, base = (DB.config.customs[id] || {}).mu || (LIB_RAW[id] || [])[1];
    DB.config.muOverride = DB.config.muOverride || {};
    if (el.value === base) delete DB.config.muOverride[id]; else DB.config.muOverride[id] = el.value;
    if (DB.config.customs[id]) { DB.config.customs[id].mu = el.value; delete DB.config.muOverride[id]; }
    saveConfig(); toast(`${getEx(id).name} : muscle principal → ${MUSCLES[el.value].l.toLowerCase()}`); return viewExercise();
  }
  if (el.id === 'mv-date') { moveInfo(); return; }
  if (el.id === 'pstart') { V.pstart = el.value || TODAY(); return; }
  if (el.id === 'd-date') { V.draft.date = el.value || TODAY(); const y = window.scrollY; viewNew(); window.scrollTo(0, y); return; }
  if (el.tagName === 'SELECT' && el.dataset.u && V.view === 'session') {
    const S = DB.sessions[V.id], it = findItem(S, el.dataset.u); if (it.sets.every(x => x.done)) { const y = window.scrollY; viewSession(); window.scrollTo(0, y); }
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) closePlayer(); });
document.addEventListener('click', ev => { if (ev.target.id === 'modal') closePlayer(); });
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && $('#wake') && $('#wake').getAttribute('aria-pressed') === 'true' && !wakeLock) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } });

/* ================= DÉMARRAGE ================= */
if (!document.documentElement.lang) document.documentElement.lang = 'fr';
migrateV1();
if (STANDALONE && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
connectDb();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
